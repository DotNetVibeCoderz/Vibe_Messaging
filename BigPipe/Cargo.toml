[workspace]
resolver = "3"
members = [
    "crates/bp-protocol",
    "crates/bp-expr",
    "crates/bp-storage",
    "crates/bp-broker",
    "crates/bp-gateway",
    "crates/bigpiped",
    "tools/bpctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Gravicode Studios (led by Kang Fadhil)"]
repository = "https://github.com/DotNetVibeCoderz/Vibe_Messaging"
description = "BigPipe - high performance realtime stream processing platform. Dibuat oleh Gravicode Studios dipimpin oleh Kang Fadhil."

[workspace.dependencies]
bp-protocol = { path = "crates/bp-protocol" }
bp-expr = { path = "crates/bp-expr" }
bp-storage = { path = "crates/bp-storage" }
bp-broker = { path = "crates/bp-broker" }
bp-gateway = { path = "crates/bp-gateway" }
tokio = { version = "1.53", features = ["full"] }
bytes = "1.12"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
clap = { version = "4.6", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
crc32c = "0.6"
flate2 = "1.1"
snap = "1.1"
lz4_flex = "0.14"
zstd = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
mimalloc = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
comfy-table = "8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
