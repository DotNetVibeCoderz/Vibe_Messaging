[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bigpipe"
version = "0.1.0"
description = "Python SDK for BigPipe, the high performance realtime stream processing platform (async producer, consumer groups, share groups, SSE streaming, admin). Dibuat oleh Gravicode Studios dipimpin oleh Kang Fadhil."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Gravicode Studios" }]
keywords = ["bigpipe", "kafka", "streaming", "stream-processing", "realtime", "gravicode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/DotNetVibeCoderz/Vibe_Messaging/tree/main/BigPipe"
Documentation = "https://github.com/DotNetVibeCoderz/Vibe_Messaging/tree/main/BigPipe/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/bigpipe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
