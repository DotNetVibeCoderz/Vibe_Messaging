# Nerve - continuous integration
# Gravicode Studios, led by Kang Fadhil.
#
# The repository holds several unrelated projects, so every path filter and every working directory
# is scoped to Nerve/. Nothing here builds its siblings.
name: Nerve CI

on:
  push:
    branches: [main]
    paths:
      - 'Nerve/**'
      - '.github/workflows/nerve-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Nerve/**'
      - '.github/workflows/nerve-ci.yml'
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run the sustained-load harness (slow)'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: Nerve

jobs:
  # The library and its tests must pass on every platform it claims to support. The Avalonia panel
  # is excluded here and built separately: it needs a desktop workload the library does not.
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # One project only - dotnet restore takes a single project or solution. The test project
      # references the library, so restoring it covers both.
      - name: Restore
        run: dotnet restore tests/Nerve.Tests/Nerve.Tests.csproj

      - name: Build
        run: dotnet build tests/Nerve.Tests/Nerve.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Nerve.Tests/Nerve.Tests.csproj -c Release --no-build --verbosity normal

      # The demo exercises every feature end to end, so a green test run that still broke the
      # library's own example would not get past this.
      - name: Demo
        run: dotnet run --project src/Nerve.Demo -c Release

  # The whole solution, including the Avalonia panel. Built, not run: there is no display.
  solution:
    name: build the solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build everything
        run: dotnet build Nerve.slnx -c Release

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink wants the full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/Nerve/Nerve.csproj -c Release -o artifacts

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: Nerve/artifacts/*.*nupkg

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A shared runner is not a machine to quote numbers from - this only proves the harness still
      # runs. The figures in docs/performance.md come from a real machine.
      - name: Sustained load
        run: dotnet run --project src/Nerve.Benchmarks -c Release -- --quick

      - name: Upload the output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-run
          path: Nerve/docs/benchmark-run.txt
          if-no-files-found: ignore
