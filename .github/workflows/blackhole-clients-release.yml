# BlackHole Messaging - client SDK releases
# Gravicode Studios, led by Kang Fadhil.
#
# The Go client needs nothing here: Go modules publish by pushing a tag, which
# `BlackHole/clients/go/vX.Y.Z` already does. This workflow covers the two that need a registry
# account - PyPI and npm - and is driven by its own tag so a .NET release does not republish them.
#
# Tag shapes:
#   clients/vX.Y.Z   publishes both the Python and Node.js clients
#
# Credentials:
#   PyPI  trusted publishing (no secret), or a PYPI_API_TOKEN project token
#   npm   trusted publishing via OIDC (no secret). A plain automation token will NOT work on an
#         account with 2FA required for writes, and npm is deprecating the bypass that used to
#         allow it - see gh.io/npm-gat-bypass2fa-deprecation. Configure the package's trusted
#         publisher on npmjs.com to point at this repository and workflow.

name: BlackHole Clients Release

on:
  push:
    tags: ['clients/v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check the packages without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Nothing is published before the suites that prove the clients still speak the protocol.
  verify:
    name: Verify ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        sdk: [python, nodejs, go]

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the interop server
        run: dotnet build BlackHole/tests/BlackHole.InteropServer -c Release

      - name: Install Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test the Python client
        if: matrix.sdk == 'python'
        working-directory: BlackHole/clients/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest tests/ -q

      - name: Install Node.js
        if: matrix.sdk == 'nodejs'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test the Node.js client
        if: matrix.sdk == 'nodejs'
        working-directory: BlackHole/clients/nodejs
        run: node --test

      - name: Install Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Test the Go client
        if: matrix.sdk == 'go'
        working-directory: BlackHole/clients/go
        run: |
          go vet ./...
          go test ./blackhole/ -count=1 -timeout 300s

  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    permissions:
      # Lets PyPI trusted publishing mint a short-lived credential, so no long-lived token has to
      # live in this repository at all. Delete the token step below if you use it.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the distributions
        working-directory: BlackHole/clients/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: BlackHole/clients/python/dist/
          # Drop this line once trusted publishing is configured for the project on PyPI.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    environment: npm
    permissions:
      # OIDC trusted publishing: npm mints a short-lived credential from this token, so no
      # long-lived secret is needed. npm is actively deprecating token-based 2FA bypass for direct
      # publishing (gh.io/npm-gat-bypass2fa-deprecation), which is why this is the primary path -
      # an automation token simply cannot publish from an account with 2FA on writes.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later; the version bundled with Node 22 is older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Pack and inspect
        working-directory: BlackHole/clients/nodejs
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: BlackHole/clients/nodejs
        env:
          # Only used if the package is not yet configured for trusted publishing on npmjs.com.
          # Leave NPM_TOKEN unset once trusted publishing is in place.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A scoped package defaults to private, which fails without a paid plan; --access public
        # is what makes @gravicode/blackhole-messaging installable by anyone.
        run: npm publish --access public
