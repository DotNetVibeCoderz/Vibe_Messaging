# BlackHole Messaging - continuous integration
# Gravicode Studios, led by Kang Fadhil.
#
# The repository holds several unrelated projects, so every path filter and every working
# directory is scoped to BlackHole/. Nothing here builds its siblings.

name: BlackHole CI

on:
  push:
    # A release is cut by pushing a vX.Y.Z tag, so tags must trigger this workflow - without them
    # the publish job below is unreachable and a release tag silently does nothing.
    #
    # The path filter applies to tag pushes as well as branch pushes, which is fine here because a
    # release tag always lands on a commit that touched BlackHole/. It also keeps pushes that only
    # touch the sibling projects in this repository from running this workflow at all.
    branches: [main]
    tags: ['v*']
    paths:
      - 'BlackHole/**'
      - '.github/workflows/blackhole-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'BlackHole/**'
      - '.github/workflows/blackhole-ci.yml'
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run the benchmark suite (slow)'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: BlackHole

jobs:
  # The library and its tests must pass on every platform it claims to support. The IoT panel is
  # excluded here and built separately: it needs a desktop workload the library does not.
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('BlackHole/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore src/BlackHole/BlackHole.csproj
          dotnet restore tests/BlackHole.Tests/BlackHole.Tests.csproj

      - name: Build library
        run: dotnet build src/BlackHole/BlackHole.csproj -c Release --no-restore

      - name: Run tests
        run: >
          dotnet test tests/BlackHole.Tests/BlackHole.Tests.csproj
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ../../artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: BlackHole/artifacts/test-results/
          retention-days: 14

  # The demo has to actually run: a messaging library that compiles but cannot complete a round
  # trip is not passing.
  smoke:
    name: Run the demo end to end
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run the demo
        timeout-minutes: 5
        run: dotnet run --project src/BlackHole.Demo -c Release -- --rpc 2000 --batch 1000 --stream 2097152

  # Each client SDK is a second implementation of the wire format, so each one is tested against
  # the real .NET server rather than a mock. A codec that drifts by a byte fails here.
  clients:
    name: ${{ matrix.sdk }} client
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: Python
            setup: python
          - sdk: Go
            setup: go
          - sdk: Node.js
            setup: node

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The suites fall back to `dotnet run`, but a prebuilt server makes them start in seconds.
      - name: Build the interop server
        run: dotnet build tests/BlackHole.InteropServer -c Release

      - name: Install Python
        if: matrix.setup == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test the Python client
        if: matrix.setup == 'python'
        working-directory: BlackHole/clients/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest tests/ -v

      - name: Install Go
        if: matrix.setup == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Test the Go client
        if: matrix.setup == 'go'
        working-directory: BlackHole/clients/go
        run: |
          go vet ./...
          go test ./blackhole/ -count=1 -timeout 300s -v

      - name: Install Node.js
        if: matrix.setup == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test the Node.js client
        if: matrix.setup == 'node'
        working-directory: BlackHole/clients/nodejs
        run: node --test

  # The Avalonia panel builds on Windows, where its operators run it.
  gateway:
    name: Build the IoT panel
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/BlackHole.IoTGateway/BlackHole.IoTGateway.csproj -c Release

  pack:
    name: Pack BlackHole.Messaging
    runs-on: ubuntu-latest
    needs: [test, smoke]

    steps:
      - uses: actions/checkout@v5
        with:
          # SourceLink embeds commit information, which needs the full history.
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: >
          dotnet pack src/BlackHole/BlackHole.csproj
          -c Release
          -o ../artifacts/packages
          -p:ContinuousIntegrationBuild=true

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: nuget-package
          path: artifacts/packages/*.*nupkg
          retention-days: 30

  # Benchmarks are slow and noisy on shared runners, so they never gate a merge. Run them by hand
  # when a change should have moved the numbers, and read the trend rather than the absolute values.
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Throughput harness
        timeout-minutes: 20
        run: dotnet run --project src/BlackHole.Benchmarks -c Release -- --quick --terse

      - name: Micro-benchmarks
        timeout-minutes: 40
        run: >
          dotnet run --project src/BlackHole.Benchmarks -c Release --
          --filter "*CodecBenchmarks*" "*HeaderDecodeBenchmarks*" "*TopicFilterBenchmarks*"
          --job short

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-reports
          path: BlackHole/src/BlackHole.Benchmarks/BenchmarkDotNet.Artifacts/results/
          retention-days: 30

  # Publishing is driven by a tag, so a release is always something someone deliberately cut.
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [test, smoke, pack]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/BlackHole/BlackHole.csproj
          -c Release
          -o ../artifacts/packages
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "../artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
